<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Games - Razvan Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="bg-rift" aria-hidden="true"></canvas>
<div class="page">
  <!-- Bauhaus Navbar -->
  <nav class="navbar">
    <div class="navbar-buttons">
      <div class="navbar-button"><a href="../projects/index.html">Projects</a></div>
      <div class="navbar-button"><a href="../../index.html">Home</a></div>
      <div class="navbar-button active"><a href="index.html">Games</a></div>
    </div>
    <button class="theme-toggle-btn" aria-label="Toggle theme">
      <!-- Icon injected by main.js -->
    </button>
  </nav>

  <section class="arcade-section">
    <div class="section-header-wrap reveal" style="max-width: 900px; margin: 0 auto 30px;">
      <span class="bauhaus-dot"></span>
      <h2 class="section-header">Interactive Games Terminal</h2>
      <div class="section-line"></div>
    </div>

    <div class="game-selector reveal">
      <button class="game-btn active" onclick="loadGame('calculator')">
        <i class="icon">✖️</i> Calculator.js
      </button>
      <button class="game-btn" onclick="loadGame('memorycards')">
        <i class="icon">🃟</i> MemoryCards.js
      </button>
      <button class="game-btn" onclick="loadGame('xo')">
        <i class="icon">ⓧ</i> Xo.js
      </button>
      <button class="game-btn" onclick="loadGame('sketch')">
        <i class="icon">⚇</i> Sketch.js
      </button>
    </div>

    <div class="terminal-container reveal">
      <div class="terminal-header">
        <div class="dots"><span></span><span></span><span></span></div>
        <span id="current-game-title">GAME TERMINAL: CALCULATOR.JS</span>
      </div>
      <div class="terminal-screen">
        <iframe id="game-frame" src="../../shared/resources/games/calculator/index.html"></iframe>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>© 2025 Rzv. Built with Bauhaus Minimalism & Clean Code.</p>
  </footer>
</div>

<script src="script.js"></script>
<script src="../../shared/js/main.js"></script>
</body>
</html>
